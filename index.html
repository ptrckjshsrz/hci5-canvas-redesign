<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Cross-Course Board</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="frame">

  <header class="topbar">
    <div class="brand">MY COURSEWORK · all 5 courses</div>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
      <input type="text" placeholder="Search (NONFUNCTIONAL)" aria-label="Search (nonfunctional)">
    </label>
    <div class="term">Fall 2026 · Week 11</div>
  </header>

  <div class="body">
    <main class="main">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Status filter">
          <button class="btn" data-filter="all">All</button>
          <button class="btn on" data-filter="incomplete">Incomplete</button>
          <button class="btn" data-filter="completed">Completed</button>
        </div>
        <label class="course-filter">Course
          <select id="course">
            <option value="all">All courses</option>
            <option value="HCI">HCI</option>
            <option value="AI">AI</option>
            <option value="Database">Database</option>
            <option value="Prog.">Programming</option>
            <option value="Finance">Finance</option>
          </select>
        </label>
      </div>

      <div class="cols n2" id="cols"></div>
    </main>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
